<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day 2024 ❤️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.0.0"></script>
    <style>
        body {
            text-align: center;
            background-color: #ffccd5;
            padding: 50px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
        }
        h1 {
            color: #d63384;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px #ff4d6d;
        }
        .yes-btn {
            font-size: 20px;
            transition: all 0.3s ease;
            background-color: #ff4d6d;
            border: none;
        }
        .yes-btn:hover {
            background-color: #e60048;
        }
        .gif-container img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
        .btn-danger {
            background-color: #ff1744;
            border: none;
        }
        .btn-danger:hover {
            background-color: #c40030;
        }
        #next-btn {
            display: none;
        }
        .celebration-text {
            font-size: 2rem;
            color: #e60048;
            font-weight: bold;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .yes-btn {
                font-size: 18px;
            }
            .btn {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <h1 class="mb-4">Will You Be Niranjan's Valentine? 💘</h1>
    <div class="gif-container mb-3">
        <img id="gif" src="https://media.tenor.com/FkhHW_OewrcAAAAj/bubu-thinking-new-bubu-sad.gif" alt="Sad GIF">
    </div>
    <button id="yes" class="btn btn-success yes-btn">Yes ❤️</button>
    <button id="no" class="btn btn-danger">No 💔</button>
    <button id="next-btn" class="btn btn-danger"></button>
    <div id="celebration" class="celebration-text"></div>
    
    <script>
        $(document).ready(function(){
            let yesSize = 20;
            const sadGif = "https://media.tenor.com/FkhHW_OewrcAAAAj/bubu-thinking-new-bubu-sad.gif";
            const hugGif = "https://media1.tenor.com/m/2p9llGFLJLUAAAAC/hug.gif";
            let nextButtons = ["Are you sure? 💭", "Really sure? 😢", "Are you positive? 😭", "Pookie please... 🥺", "Just think about it! 🤔", "If you say no, I will be really sad... 😞", "I will be very sad... 😢", "I will be very very very very sad... 💔"];
            let nextIndex = 0;

            $('#yes').click(function(){
                $('button').remove();
                $('h1').text("Knew you would say yes! 😍");
                $('#gif').attr("src", hugGif);
                $('#celebration').text("You are the best! Love you! 💖");
                confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
            });
            
            $('#no').click(function(){
                $(this).remove();
                $('#next-btn').text(nextButtons[nextIndex]).show();
                $('#gif').attr("src", sadGif);
                nextIndex++;
                yesSize += 10;
                $('#yes').css('font-size', yesSize + 'px');
            });
            
            $('#next-btn').click(function(){
                if(nextIndex < nextButtons.length) {
                    $(this).text(nextButtons[nextIndex]);
                    nextIndex++;
                } else {
                    $(this).remove();
                }
                yesSize += 10;
                $('#yes').css('font-size', yesSize + 'px');
            });
        });
    </script>
</body>
</html>
